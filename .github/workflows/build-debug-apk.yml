name: Build Debug APK (No Cache)

# ==============================================================================
# Flujo de Integración Continua (CI/CD) para Pocket Engine
# 
# Solución al error de sdkmanager:
# - Se eliminó la acción deprecada 'android-actions/setup-android@v3' que fallaba
#   al buscar el paquete obsoleto 'tools'.
# - Se utiliza el Android SDK nativo preinstalado en el runner Ubuntu de GitHub,
#   resolviendo dinámicamente cmdline-tools y configurando NDK 26.1.10909125.
# - Compila Rust para 32 y 64 bits y genera el APK Debug sin caché con Gradle 9.3.1.
# ==============================================================================

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  # Permite al desarrollador disparar la compilación manualmente desde su móvil en GitHub
  workflow_dispatch:

jobs:
  build-debug:
    name: Compilar APK Debug (C++, Rust, Lua)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Descargar todo el código del repositorio
      - name: 📥 1. Clonar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Java JDK 21 (Sin caché de Gradle)
      - name: ☕ 2. Configurar Java JDK 21 (Temurin - Sin Caché)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: ''

      # 3. Configurar Android SDK, NDK y CMake sin la acción con bug setup-android
      - name: 📱 3. Configurar Android SDK, NDK y CMake
        run: |
          echo "Configurando entorno de Android SDK..."
          ANDROID_SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_PATH" >> $GITHUB_ENV
          
          # Localizar la versión más reciente de cmdline-tools disponible en el runner
          CMDLINE_DIR=$(find "$ANDROID_SDK_PATH/cmdline-tools" -maxdepth 2 -name "bin" -type d | sort -V | tail -n 1)
          if [ -n "$CMDLINE_DIR" ]; then
            echo "cmdline-tools bin encontrado en: $CMDLINE_DIR"
            echo "$CMDLINE_DIR" >> $GITHUB_PATH
            echo "$ANDROID_SDK_PATH/platform-tools" >> $GITHUB_PATH
            SDKM="$CMDLINE_DIR/sdkmanager"
          else
            SDKM="sdkmanager"
          fi
          
          echo "Aceptando licencias del Android SDK..."
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          
          NDK_VERSION="26.1.10909125"
          CMAKE_VERSION="3.22.1"
          
          if [ -d "$ANDROID_SDK_PATH/ndk/$NDK_VERSION" ]; then
            echo "✅ Android NDK $NDK_VERSION ya está presente en el sistema."
          else
            echo "📦 Instalando Android NDK $NDK_VERSION y CMake $CMAKE_VERSION..."
            "$SDKM" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"
          fi
          
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_PATH/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_PATH/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "NDK configurado exitosamente en: $ANDROID_SDK_PATH/ndk/$NDK_VERSION"

      # 4. Descargar dependencias de compilación para C++
      - name: ⚙️ 4. Descargar dependencias de C++ (CMake, Ninja, Build-Essential)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config

      # 5. Descargar e instalar Rust y toolchains para Android (32 y 64 bits)
      - name: 🦀 5. Descargar e instalar Rust y arquitecturas Android (arm64, armv7, x86_64, x86)
        run: |
          echo "Configurando Rust stable toolchain..."
          rustup default stable
          rustup update
          echo "Añadiendo targets nativos de Android para Rust..."
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android
          echo "Instalando cargo-ndk..."
          cargo install cargo-ndk --locked || cargo install cargo-ndk || true

      # 6. Compilar núcleo nativo Rust al no haber binarios .so en el repositorio público
      - name: 🦀 6. Compilar núcleo Rust (pocketengine_core) para las 4 arquitecturas Android
        working-directory: app/src/main/rust
        run: |
          echo "Compilando pocketengine_core para arm64-v8a, armeabi-v7a, x86_64 y x86..."
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../jniLibs build --release
          echo "Verificando librerías .so generadas desde Rust en jniLibs:"
          ls -lh ../jniLibs/*/*.so || true

      # 7. Descargar dependencias de Lua 5.4 oficial
      - name: 🌙 7. Descargar e instalar utilidades de Lua 5.4 oficial
        run: |
          sudo apt-get install -y --no-install-recommends \
            lua5.4 \
            liblua5.4-dev
          lua5.4 -v

      # 8. Generar firma de depuración desde cero con el script .sh sin esperar ninguna
      - name: 🔑 8. Generar firma Debug desde cero (Script forzado .sh)
        run: |
          chmod +x ./scripts/generate_debug_keystore.sh
          ./scripts/generate_debug_keystore.sh "$GITHUB_WORKSPACE/debug.keystore"
          ls -la "$GITHUB_WORKSPACE/debug.keystore"

      # 9. Configurar Gradle oficial versión 9.3.1 (con caché deshabilitada por solicitud)
      - name: 🐘 9. Configurar Gradle 9.3.1 (Caché desactivada)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      # 10. Compilar APK Debug limpio sin caché
      - name: 🔨 10. Compilar APK Debug (assembleDebug sin caché)
        run: |
          echo "Iniciando compilación limpia de Pocket Engine APK Debug..."
          gradle :app:assembleDebug \
            --no-build-cache \
            --no-daemon \
            --stacktrace

      # 11. Verificar y preparar el APK Debug generado
      - name: 🔍 11. Verificar APK Debug generado
        run: |
          echo "Listando archivos de salida en app/build/outputs/apk/debug/:"
          ls -lh app/build/outputs/apk/debug/
          
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "APK generado exitosamente en: $APK_PATH"
            cp "$APK_PATH" "PocketEngine-Debug.apk"
            ls -lh PocketEngine-Debug.apk
          else
            echo "❌ No se encontró ningún archivo APK generado."
            exit 1
          fi

      # 12. Subir el APK Debug como artefacto de GitHub descargable
      - name: 📤 12. Subir artefacto APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: pocket-engine-debug-apk
          path: |
            PocketEngine-Debug.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
