name: Build Debug APK (No Cache)

# ==============================================================================
# Flujo de Integración Continua (CI/CD) para Pocket Engine
# 
# Características:
# 1. Descarga el código completo del repositorio.
# 2. Instala toolchains nativas completas: C++, Android NDK, CMake, Rust y Lua 5.4.
# 3. Compilación 100% limpia SIN CACHÉ (evita artefactos residuales o desincronizados).
# 4. Generación desatendida forzada de la firma Debug desde cero usando script .sh.
# 5. Genera el APK Debug listo para descarga e instalación en teléfonos móviles
#    a través de Uptodown, tiendas alternativas o descarga directa de artefactos.
# ==============================================================================

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  # Permite al desarrollador disparar la compilación manualmente desde su móvil en GitHub
  workflow_dispatch:

jobs:
  build-debug:
    name: Compilar APK Debug (C++, Rust, Lua)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Descargar todo el código del repositorio
      - name: 📥 1. Clonar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configuración de Java JDK 17 (Sin caché de Gradle)
      - name: ☕ 2. Configurar Java JDK 17 (Temurin - Sin Caché)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Sin cache de Gradle como fue solicitado expresamente
          cache: ''

      # 3. Configurar Android SDK, NDK y CMake
      - name: 📱 3. Configurar Android SDK y NDK
        uses: android-actions/setup-android@v3

      - name: 📦 4. Descargar e instalar NDK y CMake de Android
        run: |
          echo "Aceptando licencias del Android SDK..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "Instalando NDK y CMake..."
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      # 5. Descargar dependencias de compilación para C++
      - name: ⚙️ 5. Descargar dependencias de C++ (CMake, Ninja, Build-Essential)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config

      # 6. Descargar e instalar Rust y toolchains para Android (32 y 64 bits)
      - name: 🦀 6. Descargar e instalar Rust y arquitecturas Android (arm64, armv7, x86_64, x86)
        run: |
          echo "Instalando Rust toolchain..."
          rustup default stable
          rustup update
          echo "Añadiendo targets nativos de Android para Rust..."
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android
          echo "Instalando cargo-ndk..."
          cargo install cargo-ndk --locked || true

      # 6.1 Compilar núcleo nativo Rust al no haber binarios .so en el repositorio público
      - name: 🦀 6.1 Compilar núcleo Rust (pocketengine_core) para las 4 arquitecturas Android
        working-directory: app/src/main/rust
        run: |
          echo "Compilando pocketengine_core para arm64-v8a, armeabi-v7a, x86_64 y x86..."
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../jniLibs build --release
          echo "Verificando librerías .so generadas desde Rust en jniLibs:"
          ls -lh ../jniLibs/*/*.so || true

      # 7. Descargar dependencias de Lua 5.4 oficial
      - name: 🌙 7. Descargar e instalar utilidades de Lua 5.4 oficial
        run: |
          sudo apt-get install -y --no-install-recommends \
            lua5.4 \
            liblua5.4-dev
          lua5.4 -v

      # 8. Generar firma de depuración desde cero con el script .sh sin esperar ninguna
      - name: 🔑 8. Generar firma Debug desde cero (Script forzado .sh)
        run: |
          chmod +x ./scripts/generate_debug_keystore.sh
          ./scripts/generate_debug_keystore.sh "$GITHUB_WORKSPACE/debug.keystore"
          ls -la "$GITHUB_WORKSPACE/debug.keystore"

      # 9. Configurar Gradle oficial (con caché deshabilitada por solicitud)
      - name: 🐘 9. Configurar Gradle (Caché desactivada)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      # 10. Compilar APK Debug limpio sin caché
      - name: 🔨 10. Compilar APK Debug (assembleDebug sin caché)
        run: |
          echo "Iniciando compilación limpia de Pocket Engine APK Debug..."
          gradle assembleDebug \
            --no-build-cache \
            --no-daemon \
            --stacktrace \
            --info

      # 11. Verificar y listar los APKs generados
      - name: 🔍 11. Verificar APK Debug generado
        run: |
          echo "Listando archivos de salida en app/build/outputs/apk/debug/:"
          ls -lh app/build/outputs/apk/debug/
          
          # Renombrar con timestamp y versión para facilidad de identificación móvil
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "APK generado exitosamente en: $APK_PATH"
            cp "$APK_PATH" "PocketEngine-Debug.apk"
            ls -lh PocketEngine-Debug.apk
          else
            echo "❌ No se encontró ningún archivo APK generado."
            exit 1
          fi

      # 12. Subir el APK Debug como artefacto de GitHub descargable
      - name: 📤 12. Subir artefacto APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: pocket-engine-debug-apk
          path: |
            PocketEngine-Debug.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
